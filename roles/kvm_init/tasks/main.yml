---
- name: Install KVM and Cloudstack agent
  ansible.builtin.apt:
     name:
       - "{{ qemu_package }}"
       - cloudstack-agent
     state: present
     update_cache: yes
     cache_valid_time: 3600
  vars:
    qemu_package: "{{ 'qemu-system-arm' if ansible_architecture == 'aarch64' else 'qemu-system-x86' }}"

- name: Allow the Ansible user to run the CloudStack agent setup
  ansible.builtin.copy:
    dest: /etc/sudoers.d/99-cloudstack-setup-agent
    content: "{{ cloudstack_agent_ssh_user }} ALL=NOPASSWD: {{ cloudstack_agent_setup_commands | join(', ') }}\n"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Prepare ARM hosts for virtualizing if ARM is in KVM cluster
  ansible.builtin.lineinfile:
    path: /etc/cloudstack/agent/agent.properties
    regexp: '^{{ item.key | regex_escape }}='
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: guest.cpu.arch, value: aarch64 }
    - { key: guest.cpu.mode, value: host-passthrough }
  when: ansible_facts['architecture'] == 'aarch64'
  notify: Restart cloudstack-agent

- name: Enable the console proxy on QEMU 
  ansible.builtin.blockinfile:
    path: /etc/libvirt/qemu.conf
    marker: "# {mark} VNC permissive listen"
    block: |
      vnc_listen = "0.0.0.0"
  notify: Restart libvirt

- name: Mask the socket-based listeners  
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
    state: stopped
    enabled: false
  loop:
    - libvirtd.socket
    - libvirtd-ro.socket
    - libvirtd-admin.socket
    - libvirtd-tls.socket
    - libvirtd-tcp.socket
  become: true
  notify: Restart libvirt

- name: Configures plain TCP for libvirt (Cloudstack corrects once host is added)
  ansible.builtin.blockinfile:
    path: /etc/libvirt/libvirtd.conf
    marker: "# {mark} Plain TCP"
    block: |
      listen_tls=0
      listen_tcp=1
      tcp_port = "16509"
      mdns_adv = 0
      auth_tcp = "none"
  notify: Restart libvirt

- name: Disable AppArmor profiles for libvirt
  ansible.builtin.file:
    src: "/etc/apparmor.d/{{ item }}"
    dest: "/etc/apparmor.d/disable/{{ item }}"
    state: link
  loop:
    - usr.sbin.libvirtd
    - usr.lib.libvirt.virt-aa-helper
  notify: Reload apparmor

- name: Check for netplan
  ansible.builtin.stat:
    path: /etc/netplan/01-netcfg.yaml
  register: netplan_file

- name: Deploy netplan bridge config
  ansible.builtin.template:
    src: 01-netcfg.yaml.j2
    dest: /etc/netplan/01-netcfg.yaml
    mode: '0600'
  when: not netplan_file.stat.exists
  notify:
    - Apply netplan
    - Generate netplan
    - Restart systemd-networkd

- name: Find old netplan configs
  ansible.builtin.find:
    paths: /etc/netplan
    patterns: '*.yaml'
    excludes: '01-netcfg.yaml'
  register: netplan_old

- name: Remove old netplan configs
  ansible.builtin.file:
    path: "{{ item.path }}" 
    state: absent
  loop: "{{ netplan_old.files }}"
  loop_control:
    label: "{{ item.path }}"
  notify:
    - Apply netplan
    - Generate netplan
    - Restart systemd-networkd

- name: Ensure CloudStack agent is started
  ansible.builtin.systemd_service:
    name: cloudstack-agent
    state: started
    enabled: true
    daemon_reload: true
  become: true
