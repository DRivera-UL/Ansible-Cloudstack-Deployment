---
- name: Validate the directory for keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root # Default on normal installs
    group: root # Default on normal installs
    mode: '0775' # Default on normal installs

- name: Add ShapeBlue's Cloudstack key
  ansible.builtin.get_url:
    url: http://packages.shapeblue.com/release.asc
    dest: /etc/apt/keyrings/cloudstack.asc
    mode: '0644'

- name: Add ShapeBlue's CloudStack repository
  ansible.builtin.deb822_repository:
    name: cloudstack
    types: deb
    uris: http://packages.shapeblue.com/cloudstack/upstream/debian/4.22
    suites: /
    signed_by: /etc/apt/keyrings/cloudstack.asc
    state: present

- name: Update apt cache after adding ShapeBlue repo
  ansible.builtin.apt:
    update_cache: true

