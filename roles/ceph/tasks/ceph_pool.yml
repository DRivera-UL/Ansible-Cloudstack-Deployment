---
- name: Pool creation
  ceph.automation.ceph_pool:
    name: "{{ item.name }}"
    state: present
    size: "{{ item.size }}"
    application: "{{ item.application }}"
    pool_type: "{{ item.pool_type }}"
    pg_autoscale_mode: "{{ item.pg_autoscale_mode }}"
  with_items: "{{ pools }}"
  environment:
    CEPH_CONTAINER_BINARY: podman
    CEPH_CONTAINER_IMAGE: "{{ ceph_running_image }}"
