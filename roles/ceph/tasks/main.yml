---
- name: Validate monitor count
  ansible.builtin.assert:
    that:
      - groups['ceph_mon'] | default([]) | length > 0
      - ceph_mon_allow_even or (groups['ceph_mon'] | length) is odd
    fail_msg: >-
      ceph_mon has {{ groups['ceph_mon'] | default([]) | length }} hosts.
      At least one monitor is required, and an odd number is recommended 
      for quorum (an even count tolerates no more failures than one fewer).
      Set ceph_mon_allow_even: true to override.
    quiet: true
  run_once: true

- name: Ensure the apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download the Ceph release key
  ansible.builtin.get_url:
    url: https://download.ceph.com/keys/release.asc
    dest: /etc/apt/keyrings/ceph.asc
    owner: root
    group: root
    mode: '0644'

- name: Add the Ceph repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/ceph.asc] https://download.ceph.com/debian-{{ ceph_release }}/ {{ ansible_distribution_release }} main"
    filename: ceph
    state: present

- name: Install Ceph packages and prerequisites
  ansible.builtin.apt:
    name:
      - python3
      - chrony
      - lvm2
      - podman
      - cephadm
      - ceph-common
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Bootstrap from the first monitor
  when: inventory_hostname == groups['ceph_mon'][0]
  block:
    - name: Bootstrap a cluster via cephadm
      cephadm_bootstrap:
        mon_ip: "{{ inventory_hostname }}"
        dashboard: true
        monitoring: true
        initial_dashboard_user: "{{ ceph_dashboard_user }}"
        initial_dashboard_password: "{{ ceph_dashboard_password }}"
        allow_fqdn_hostname: true
      no_log: true

    - name: Read the cephadm SSH public key
      ansible.builtin.slurp:
        src: /etc/ceph/ceph.pub
      register: ceph_pub_key

- name: Authorize the cephadm SSH key for root on all Ceph nodes
  ansible.posix.authorized_key:
    user: root # Change later, Ceph uses root by default but instead make a service user for Ceph instead of root.
    key: "{{ hostvars[groups['ceph_mon'][0]].ceph_pub_key.content | b64decode }}"
    state: present

- name: Add hosts from the first monitor
  when: inventory_hostname == groups['ceph_mon'][0]
  block:
    - name: Add monitors
      ceph_orch_host:
        name: "{{ hostvars[item].ansible_nodename }}"
        address: "{{ item }}"
        labels: [mon]
      loop: "{{ groups['ceph_mon'] }}"
