---
- name: Create client.{{ ceph_pool_user }}
  ceph.automation.ceph_key:
    name: client.{{ ceph_pool_user }}
    state: present
    caps:
      mon: "profile rbd"
      osd: "profile rbd pool={{ ceph_pool_name }}"
    import_key: true
    dest: /etc/ceph/ceph.client.cloudstack.keyring
    owner: root
    group: root
    mode: "0600"
